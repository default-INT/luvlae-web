name: Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Build Cloudflare Worker
        if: github.event_name == 'pull_request'
        run: pnpm build:cloudflare

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -o pipefail

          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/cloudflare-deploy-$attempt.log"

            if [ "$attempt" -eq 1 ]; then
              if pnpm deploy:cloudflare 2>&1 | tee "$log_file"; then
                exit 0
              fi
            elif pnpm --filter @luvlae/web exec vinext-cloudflare deploy --skip-build 2>&1 | tee "$log_file"; then
              exit 0
            fi

            if ! grep -Eq -- '-> (429|5[0-9][0-9]) ' "$log_file" &&
               ! { grep -q 'APIError' "$log_file" && grep -q -- '-> 200 OK' "$log_file"; }; then
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "Cloudflare API returned a transient deployment error. Retrying in $((attempt * 15)) seconds (attempt $((attempt + 1)) of 3)."
            sleep "$((attempt * 15))"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
