name: Cloudflare Workers

on:
  push:
    branches: [main, 'release/release-*']
  create:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-${{ startsWith(github.ref, 'refs/heads/release/release-') && ((github.event_name == 'create' && github.event.ref_type == 'branch') || (github.event_name == 'push' && !github.event.created && !github.event.deleted)) && 'production' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks-and-deploy:
    # Branch creation is handled by create; avoid a duplicate deployment from push.
    if: >-
      (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.ref, 'refs/heads/release/release-')) ||
      (github.event_name == 'push' && !github.event.deleted && (!github.event.created || github.ref == 'refs/heads/main')) ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_ENV: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && 'stage' || 'production' }}
      STRIPE_MODE: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' && vars.STRIPE_PRODUCTION_MODE == 'live' && 'live' || 'test' }}
      STRIPE_CHECKOUT_ENABLED: ${{ github.event_name != 'pull_request' && ((github.ref == 'refs/heads/main' && vars.STRIPE_STAGE_CHECKOUT_ENABLED == 'true') || (github.ref != 'refs/heads/main' && vars.STRIPE_PRODUCTION_CHECKOUT_ENABLED == 'true')) && 'true' || 'false' }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' && vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test production release selection
        run: node --test .github/scripts/production-release.test.mjs

      - name: Test deployment artifact isolation
        run: node --test apps/web/scripts/cloudflare.test.mjs

      - name: Run ESLint
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Select current production release
        id: release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/release/')
        run: node .github/scripts/production-release.mjs >> "$GITHUB_OUTPUT"

      - name: Build Cloudflare Worker
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || steps.release.outputs.deploy == 'true'
        run: pnpm build:cloudflare

      - name: Deploy to Cloudflare Workers
        if: steps.release.outputs.deploy == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          set -o pipefail

          for attempt in 1 2 3; do
            # Recheck after waiting/building, and before every transient retry.
            if [ "$DEPLOY_ENV" = 'production' ]; then
              selection=$(node .github/scripts/production-release.mjs)
              if [ "$selection" != 'deploy=true' ]; then
                exit 0
              fi
            else
              remote_sha=$(git ls-remote --heads origin refs/heads/main | cut -f1)
              if [ "$remote_sha" != "$GITHUB_SHA" ]; then
                echo 'Stage deployment skipped: main has a newer commit.'
                exit 0
              fi
            fi

            log_file="$RUNNER_TEMP/cloudflare-deploy-$attempt.log"

            if pnpm --filter @luvlae/web exec node scripts/cloudflare.mjs deploy --skip-build 2>&1 | tee "$log_file"; then
              exit 0
            fi

            if ! grep -Eq -- '-> (429|5[0-9][0-9]) ' "$log_file" &&
               ! { grep -q 'APIError' "$log_file" && grep -q -- '-> 200 OK' "$log_file"; }; then
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "Cloudflare API returned a transient deployment error. Retrying in $((attempt * 15)) seconds (attempt $((attempt + 1)) of 3)."
            sleep "$((attempt * 15))"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
