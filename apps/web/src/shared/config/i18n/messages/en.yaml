ingredientsPage:
  eyebrow: Ingredient guide
  title: Berberine Patch Ingredients
  headline: |-
    Get to know<br>
    what’s inside
  description: Explore the 11 ingredients and per-patch amounts in Luvlae Berberine Patches.
  lead: Luvlae Berberine Patches combine berberine with botanical extracts, vitamins, minerals, and L-carnitine in one easy-to-use patch.
  detail: Explore the full ingredient list and amounts per patch, then discover more about each ingredient below.
  exploreLink: Explore the ingredients
  imageAlt: Luvlae ingredient graphic listing 11 ingredients and their amounts per one patch
  profilesTitle: Meet the ingredients
  profilesDescription: Explore the 11 ingredients listed in Luvlae Berberine Patches — from botanical extracts to vitamins, minerals, and L-carnitine.
  relatedEyebrow: Keep exploring
  relatedTitle: See the product in context
  productLink: Product details
  safetyLink: Safety considerations
  scienceLink: Science and evidence
  ingredients:
    berberine:
      name: Berberine
      description: A naturally occurring plant compound studied for its potential role in glucose and lipid metabolism, primarily in oral formulations.
    fenugreek:
      name: Fenugreek seed extract
      description: A botanical with a long history of use in food and traditional practices, including digestive wellness.
    chromium:
      name: Chromium
      description: A trace mineral studied for its involvement in insulin action and the metabolism of carbohydrates, fats, and proteins.
    ginseng:
      name: Panax ginseng extract
      description: A traditional botanical studied for fatigue and aspects of cognitive function.
    greenTea:
      name: Green tea extract
      description: An extract known for its naturally occurring polyphenols, including catechins, which have antioxidant properties.
    cinnamon:
      name: Cinnamon bark extract
      description: A familiar botanical studied for its plant compounds and potential effects on glucose metabolism.
    ginger:
      name: Ginger root extract
      description: A traditional botanical best known for its use in digestive wellness and research on nausea when taken orally.
    carnitine:
      name: L-carnitine
      description: A compound naturally present in the body that helps transport fatty acids into cells’ mitochondria for energy production.
    b12:
      name: Vitamin B12
      description: A vitamin involved in normal nerve function, red blood cell formation, and DNA synthesis.
    magnesium:
      name: Magnesium
      description: A mineral involved in energy production and normal muscle and nerve function.
    vitaminC:
      name: Vitamin C (as ascorbic acid)
      description: A vitamin involved in collagen formation, normal immune function, and antioxidant protection.
