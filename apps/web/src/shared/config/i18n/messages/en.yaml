    eyebrow: EVIDENCE IN CONTEXT
    title: Research should match the product
    description: Most human berberine studies examine oral products. Experimental topical studies use other formulations. Neither establishes absorption or health outcomes for Luvlae Berberine Patches, and no Luvlae-specific human clinical study has been supplied.
    link: Read the evidence review
    noteTitle: Learn more about the format
    noteBody: Explore our ingredient, safety, and science guides for helpful product information.
  faq:
    eyebrow: FAQ
    title: Your questions, answered
    description: Everything you need to know about your daily patch routine.
    moreLink: Read more questions
    items:
      what:
        question: What are Luvlae Berberine Patches?
        answer: They are topical adhesive patches containing berberine and other listed ingredients, in a discreet, pill-free format.
      count:
        question: How many patches come in a box?
        answer: Each box contains 60 patches — a 60-day supply when used once daily.
      apply:
        question: How do I apply a patch?
        answer: Peel off the protective backing, apply to clean, dry, intact skin in an area recommended on the package, and gently press down the edges.
      wear:
        question: How long should I wear each patch?
        answer: Follow the wear time printed on your package. Remove the patch earlier if you experience irritation or discomfort.
      clothing:
        question: Can I wear a patch under clothing?
        answer: Yes. Choose an application area recommended on the package where clothing will not rub against or loosen the patch.
      water:
        question: Can I shower, swim, or exercise while wearing it?
        answer: Check the package instructions for guidance on water exposure and exercise. Do not assume the patch is waterproof.
      skin:
        question: What if I have sensitive skin?
        answer: Review the ingredients before use. Do not use if you have a known allergy to any ingredient or the adhesive. Stop use if redness, itching, or discomfort occurs.
      oral:
        question: Are patches the same as oral berberine supplements?
        answer: No. The formats differ, and studies of oral berberine do not establish absorption or benefits from Luvlae patches.
      medication:
        question: Can I use the patches while taking medication?
        answer: Consult a healthcare professional before use and show them the full ingredient list, especially if you take medication or have a medical condition.
      pregnancy:
        question: Can I use them during pregnancy or breastfeeding?
        answer: As a precaution, do not use during pregnancy or while breastfeeding.
      storage:
        question: How should I store the patches?
        answer: Follow the storage instructions on the package. Keep them out of reach of children and pets.
      buy:
        question: Where can I buy Luvlae Berberine Patches?
        answer: See the product purchase section for current pricing and availability.
